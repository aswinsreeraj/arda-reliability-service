# Alembic configuration for ARDA Reliability Service

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# Default sqlalchemy url (can be overridden by environment variable or config.py)
sqlalchemy.url = postgresql+asyncpg://arda_user:arda_password@127.0.0.1:5433/arda_reliability

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

