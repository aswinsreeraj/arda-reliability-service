services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: arda-reliability-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-arda_reliability}
      POSTGRES_USER: ${POSTGRES_USER:-arda_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-arda_password}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-arda_user} -d ${POSTGRES_DB:-arda_reliability}" ]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 2s

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.1.8
    container_name: arda-reliability-redpanda
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=1G
      - --overprovisioned
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://127.0.0.1:19092
      - --pandaproxy-addr=0.0.0.0:8082
      - --advertise-pandaproxy-addr=127.0.0.1:8082
    ports:
      - "127.0.0.1:${REDPANDA_PORT:-19092}:19092"
      - "127.0.0.1:8082:8082"
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  pgvector_data:
  redpanda_data:
