[project]
name = "arda-reliability-service"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Aswin Sreeraj", email = "aswinsreeraj96@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi[standard]>=0.162.0",
    "greenlet>=3.5.6",
    "grpcio>=1.85.1",
    "grpcio-tools>=1.85.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "pgvector>=0.5.1",
    "pydantic-settings>=2.16.2",
    "scikit-learn>=1.9.1",
    "sentence-transformers>=6.2.0",
    "sqlalchemy>=2.1.6",
]

[project.scripts]
arda-reliability-service = "arda_reliability_service:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
mypy_path = ["src", "."]
check_untyped_defs = true
ignore_missing_imports = true

[tool.ruff]
extend-exclude = ["src/arda_reliability_service/infrastructure/grpc/generated"]

